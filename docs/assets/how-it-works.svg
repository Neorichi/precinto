<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">How Precinto works</title>
  <desc id="desc">A cycle of four steps. 1, Work: your agent works in a protected folder and its files stay where it expects them, as plain text. 2, Lock: after 15 minutes idle, when the screen locks or with precinto lock, the key is wiped and the agent is paused. 3, Seal: paused sessions end and everything they wrote is encrypted into age capsules; the plain text is deleted. 4, Unlock: Touch ID, a YubiKey or a passphrase brings everything back, byte for byte. Then back to work.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .card { fill: #121a31; stroke: #26324f; stroke-width: 2; }
      .step { font-size: 15px; font-weight: 700; letter-spacing: 2.5px; }
      .name { font-size: 34px; font-weight: 700; fill: #f8fafc; }
      .body { font-size: 18px; fill: #cbd5e1; }
      .flow { stroke: #94a3b8; stroke-width: 3; }
      .flowlabel { font-size: 15px; font-style: italic; fill: #94a3b8; }
      .icon { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="640" rx="28" fill="#0b1020"/>

  <rect class="card" x="40" y="40" width="500" height="240" rx="22"/>
  <circle cx="120" cy="160" r="48" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="2"/>
  <g class="icon" stroke="#60a5fa" transform="translate(120 160)">
    <rect x="-26" y="-20" width="52" height="40" rx="7"/>
    <path d="M-14 -6 L-5 2 L-14 10"/>
    <path d="M1 10 H14"/>
  </g>
  <text class="step" x="196" y="104" fill="#60a5fa">STEP 1</text>
  <text class="name" x="196" y="144">Work</text>
  <text class="body" x="196" y="186">Your agent works in a protected</text>
  <text class="body" x="196" y="214">folder. Its files stay where it</text>
  <text class="body" x="196" y="242">expects them, as plain text.</text>

  <rect class="card" x="660" y="40" width="500" height="240" rx="22"/>
  <circle cx="740" cy="160" r="48" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="2"/>
  <g class="icon" stroke="#fbbf24" transform="translate(740 160)">
    <path d="M-13 -2 V-12 a13 13 0 0 1 26 0 V-2"/>
    <rect x="-20" y="-2" width="40" height="30" rx="6"/>
    <path d="M0 8 V16"/>
  </g>
  <text class="step" x="816" y="104" fill="#fbbf24">STEP 2</text>
  <text class="name" x="816" y="144">Lock</text>
  <text class="body" x="816" y="186">15 min idle, the screen locks, or</text>
  <text class="body" x="816" y="214">precinto lock: the key is wiped</text>
  <text class="body" x="816" y="242">and the agent is paused.</text>

  <rect class="card" x="660" y="360" width="500" height="240" rx="22"/>
  <circle cx="740" cy="480" r="48" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="2"/>
  <g class="icon" stroke="#a78bfa" transform="translate(740 480)">
    <path d="M0 -26 L24 -14 V14 L0 26 L-24 14 V-14 Z"/>
    <path d="M-24 -14 L0 -2 L24 -14"/>
    <path d="M0 -2 V26"/>
  </g>
  <text class="step" x="816" y="424" fill="#a78bfa">STEP 3</text>
  <text class="name" x="816" y="464">Seal</text>
  <text class="body" x="816" y="506">Paused sessions end. All they</text>
  <text class="body" x="816" y="534">wrote is encrypted into age</text>
  <text class="body" x="816" y="562">capsules; plain text is deleted.</text>

  <rect class="card" x="40" y="360" width="500" height="240" rx="22"/>
  <circle cx="120" cy="480" r="48" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.5" stroke-width="2"/>
  <g class="icon" stroke="#34d399" transform="translate(120 480)">
    <circle cx="-13" cy="0" r="11"/>
    <path d="M-2 0 H26"/>
    <path d="M18 0 V9"/>
    <path d="M25 0 V7"/>
  </g>
  <text class="step" x="196" y="424" fill="#34d399">STEP 4</text>
  <text class="name" x="196" y="464">Unlock</text>
  <text class="body" x="196" y="506">Come back: Touch ID, a YubiKey or</text>
  <text class="body" x="196" y="534">a passphrase. Everything returns,</text>
  <text class="body" x="196" y="562">byte for byte, where it was.</text>

  <line class="flow" x1="550" y1="160" x2="650" y2="160" marker-end="url(#arrow)"/>
  <text class="flowlabel" x="600" y="146" text-anchor="middle">you step away</text>
  <line class="flow" x1="910" y1="290" x2="910" y2="350" marker-end="url(#arrow)"/>
  <text class="flowlabel" x="926" y="325">later on</text>
  <line class="flow" x1="650" y1="480" x2="550" y2="480" marker-end="url(#arrow)"/>
  <text class="flowlabel" x="600" y="466" text-anchor="middle">you come back</text>
  <line class="flow" x1="290" y1="350" x2="290" y2="290" marker-end="url(#arrow)"/>
  <text class="flowlabel" x="274" y="325" text-anchor="end">back to work</text>
</svg>
