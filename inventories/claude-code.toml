# Claude Code inventory (schema 1). Built-in capsule-mode adapter: this file
# only feeds process matching, launch-mode classification and resume parsing.
# Owner: G3. Values are placeholders to verify against the pinned version.
# TOML rule: top-level keys must precede the first [table] header.
schema = 1
id = "claude-code"
name = "Claude Code"
status = "verified"
verified_versions = ">=2.1.295 <=2.1.329"
mode = "capsule"

# argv prefixes (after argv[0]) that bypass gate and restore (UX14).
# Claude Code runs its daemon subcommand only when `daemon` comes first or
# follows nothing but --dangerously-skip-permissions and
# --allow-dangerously-skip-permissions: a --settings injected ahead of it
# would start a session instead (D101).
passthrough = [
  ["update"], ["doctor"], ["mcp"], ["plugin"], ["config"], ["install"],
  ["setup-token"], ["--version"], ["-v"], ["--help"], ["-h"],
  ["daemon"],
  ["--dangerously-skip-permissions", "daemon"],
  ["--allow-dangerously-skip-permissions", "daemon"],
  ["--dangerously-skip-permissions", "--allow-dangerously-skip-permissions", "daemon"],
  ["--allow-dangerously-skip-permissions", "--dangerously-skip-permissions", "daemon"],
]
# argv prefixes that run gated and sealed, without a PTY.
direct = [["-p"], ["--print"], ["--output-format"]]

[[bases]]
name = "claude_config"
default = "~/.claude"
env = "CLAUDE_CONFIG_DIR"

[[bases]]
name = "claude_tmp"
default = "/private/tmp/claude-{uid}"   # linux: /tmp/claude-{uid}
env = "CLAUDE_CODE_TMPDIR"

[[bases]]
name = "claude_cache"
default = "~/Library/Caches/claude-cli-nodejs"   # linux: $XDG_CACHE_HOME/claude-cli-nodejs

[process]
# Never match on p_comm: Claude's kernel name is its version string (IM9).
# The native installer runs ~/.local/share/claude/versions/<version>; an npm
# install runs node with the `claude` bin script as argv[1] (argv_regex is
# checked against argv[1] only when argv[0] is an interpreter such as node).
exe_basenames = ["claude"]
exe_paths = ["~/.local/share/claude/versions/*", "~/.claude/local/*"]
argv_regex = ["(^|/)claude$"]

[resume]
flags = ["--resume", "-r"]
continue = ["--continue", "-c"]
fork = ["--fork-session"]
