# CI gates of docs/TESTPLAN.md §10 on every push to main and every pull
# request. Owner: G7.
#
# Pushes and pull requests run on ubuntu only: the repository is private and
# spends the plan's included minutes, and a macOS minute costs about ten
# Linux minutes. macOS runs the same gates twice a month (macos.yml), the
# crash matrix runs repeated weekly to find flaky rows (crash.yml), WSL 2 on
# a Windows runner runs weekly and on pull requests that change WSL code
# (wsl2.yml), and the secret scan runs on every push to any branch or tag
# and on pull requests (secrets.yml). The Linux runner still vets and lints the darwin and
# Windows files (make vet, staticcheck's build matrix) and builds and vets
# for Windows, so a darwin-only or Windows-only error fails the change here.
#
# E2E never runs here: the opt-in flows (PRECINTO_E2E=1, `make test-e2e`)
# need a real, logged-in Claude Code and run only on a developer machine.
# No job sets PRECINTO_E2E, and no job has secrets.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: auto
  GOFLAGS: -mod=readonly

# The four gate jobs keep the names of their former ubuntu-latest matrix
# legs, so status checks that name them keep matching.
jobs:
  lint:
    name: lint (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      # Pinned like the actions: a new release lands by changing these lines.
      - name: Install staticcheck and govulncheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install shellcheck and fish
        run: sh .github/scripts/install-shells.sh
      # gofmt, go vet for {default, testing+failpoints, testing+crossgroup,
      # testing+failpoints+crossgroup} × {darwin, linux}, internal/archtest,
      # apidoc -check, staticcheck over {darwin, linux, windows} × {default,
      # testing+failpoints+crossgroup}, govulncheck, shellcheck of the shims
      # (required: CI is set, so a missing shellcheck fails the target
      # instead of skipping). -k runs every gate even when one fails, so a
      # single run reports all of them.
      - run: make -k lint
      # The darwin results of the former macOS lint leg, on every change
      # (staticcheck for darwin runs in make lint).
      - name: govulncheck for darwin
        if: ${{ !cancelled() }}
        env:
          GOOS: darwin
        run: govulncheck ./...
      # GOOS=windows build for amd64 and arm64, and go vet with the
      # default, testing, testing+failpoints, testing+crossgroup and
      # testing+failpoints+crossgroup tags.
      - name: Windows build and vet
        if: ${{ !cancelled() }}
        run: make build-windows vet-windows

  build:
    name: build (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build build-testing build-linux
      - name: CGO-free build
        run: CGO_ENABLED=0 go build ./...

  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The shim and shell-integration tests run sh/bash/zsh/fish for real
      # and shellcheck -s sh over the shims; CI has both installed, so
      # those tests never skip here (TESTPLAN HOOK-4, D29).
      - name: Install shellcheck and fish
        run: sh .github/scripts/install-shells.sh
      # Unit and package-integration tests (-tags testing), including
      # test/integration against the testing binary in throwaway homes.
      - run: make test
      - name: Race detector
        run: make test-race
        env:
          CGO_ENABLED: "1"
      # testkit.Hygiene over every testdata/ (no real paths, emails,
      # tokens or non-fixture UUIDs, S13).
      - run: make hygiene
      # plugins/codex/ matches its recorded SHA-256 list (D41).
      - run: make codex-plugin-check

  crossgroup:
    name: crossgroup (ubuntu-latest)
    runs-on: ubuntu-latest
    # Each target bounds its test binaries at 8 min with GOTRACEBACK=all,
    # so a hang prints every goroutine's stack before the job limit.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install shellcheck and fish
        run: sh .github/scripts/install-shells.sh
      # Flows across every group: init, protect, status, run with a fake
      # harness, lock, unlock, restore; SEC-12 and SEC-33 against a
      # production build.
      - run: make crossgroup
      # The crossgroup crash rows: failpoints over the real fsx, capsule,
      # sweep and live packages (TESTPLAN §4, §10). No file excludes the
      # crossgroup tag, so this also runs every `make test-crash` test.
      - run: make crossgroup-crash

  plugin:
    name: plugin validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `claude plugin validate --strict ./plugin` when claude is available
      # on the runner (it is not installed by CI: no network login, no
      # secrets); the hooks files are also covered by G5's golden tests.
      - name: claude plugin validate
        run: |
          if [ ! -d plugin ]; then echo "plugin/ not present yet"; exit 0; fi
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate --strict ./plugin
          else
            echo "claude not available on this runner: skipped"
          fi
