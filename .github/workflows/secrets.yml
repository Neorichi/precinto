# Secret scan with gitleaks on every push to any branch or tag and on every
# pull request: about one Linux minute each. Owner: G7.
#
# The default rules plus the rules and the fixture exceptions of
# .gitleaks.toml, where every exception lives ("a new fixture gets its own
# entry here, never a wider pattern"): an inline gitleaks:allow comment is
# not honoured (--ignore-gitleaks-allow), and a .gitleaksignore file, which
# gitleaks would read from the scanned folder whatever its options say,
# fails the job. --redact keeps every secret out of the log; --verbose
# prints where each finding is.
#
# The history scan reads `git log --full-history --all` over what
# actions/checkout fetched (fetch-depth: 0: every branch and tag), with the
# diffs of merge commits against each parent (-m), so a secret added while
# resolving a conflict is found after it left the tree too. Not fetched:
# refs/pull/*/head, which GitHub keeps after a branch is force-pushed or
# deleted and which become public with the repository. Before the
# repository is published, run the same scan on a `git clone --mirror` of
# it, which has them.
name: secrets

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, as listed in the
      # release's gitleaks_8.30.1_checksums.txt.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit of every branch and tag
          persist-credentials: false
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o "$dir/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $dir/$tarball" | sha256sum --check --strict -
          tar -xzf "$dir/$tarball" -C "$dir" gitleaks
          "$dir/gitleaks" version
          echo "$dir" >> "$GITHUB_PATH"
      - name: Exceptions live in .gitleaks.toml only
        run: |
          if [ -e .gitleaksignore ]; then
            echo "::error::.gitleaksignore found: an exception goes in .gitleaks.toml, with its rule, files and exact value"
            exit 1
          fi
      # gitleaks's own default log options plus -m (merge diffs).
      - name: gitleaks over the full history
        run: >-
          gitleaks git . --config .gitleaks.toml --ignore-gitleaks-allow
          --log-opts="--full-history --all --diff-filter=tuxdb -m"
          --redact --verbose --no-banner
      - name: gitleaks over the working tree
        if: ${{ !cancelled() }}
        run: gitleaks dir . --config .gitleaks.toml --ignore-gitleaks-allow --redact --verbose --no-banner
